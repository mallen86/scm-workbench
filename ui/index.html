<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCM Workbench</title>
  <link rel="icon" href="/ui/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/ui/theme.css">
</head>
<body>
  <div id="app">
    <!-- ============ sidebar ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <img src="/ui/logo.svg" alt="" aria-hidden="true">
        </div>
        <div class="brand-text">
          <div class="brand-name">SCM Workbench</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <a class="nav-item" data-page="dashboard" data-simple-hide><span class="nav-ico" data-ico="home"></span>Dashboard</a>
        <div class="nav-sep">Workflow</div>
        <a class="nav-item" data-page="fetch"><span class="nav-ico" data-ico="download"></span>Fetch card art</a>
        <a class="nav-item" data-page="pdf"><span class="nav-ico" data-ico="pdf"></span>Create PDF</a>
        <a class="nav-item" data-page="offset" data-simple-hide><span class="nav-ico" data-ico="target"></span>Offset &amp; calibration</a>
        <div class="nav-sep">Cutting</div>
        <a class="nav-item" data-page="templates" data-simple-hide><span class="nav-ico" data-ico="scissors"></span>Cutting templates</a>
        <a class="nav-item" data-page="extras" data-simple-hide><span class="nav-ico" data-ico="sparkle"></span>Extras: MTG &amp; Sorcery</a>
        <div class="nav-sep">Reference</div>
        <a class="nav-item" data-page="sizes" data-simple-hide><span class="nav-ico" data-ico="ruler"></span>Sizes &amp; layouts</a>
        <a class="nav-item" data-page="utilities" data-simple-hide><span class="nav-ico" data-ico="wrench"></span>Utilities</a>
        <div class="nav-sep">System</div>
        <a class="nav-item" data-page="settings"><span class="nav-ico" data-ico="gear"></span>Settings</a>
      </nav>

      <div class="sidebar-foot">
        <div class="repo-pill" id="pill-scm" title="silhouette-card-maker">
          <span class="dot" id="dot-scm"></span><span class="pill-label">SCM</span>
        </div>
        <div class="repo-pill" id="pill-extras" title="scm-extras">
          <span class="dot" id="dot-extras"></span><span class="pill-label">Extras</span>
        </div>
        <div class="theme-switch" id="theme-switch" title="Toggle theme">
          <button class="ts-btn" data-theme="dark" title="Dark theme"><span data-ico="moon"></span></button>
          <button class="ts-btn" data-theme="light" title="Light theme"><span data-ico="sun"></span></button>
        </div>
      </div>
    </aside>

    <!-- ============ main ============ -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-title" id="topbar-title">Dashboard</div>
        <div class="topbar-right">
          <div class="mode-switch" id="mode-switch" title="How much of the Workbench to show — Simple keeps just the essentials (fetch the art, make the PDF)">
            <button type="button" class="ms-btn" data-mode="simple">Simple</button>
            <button type="button" class="ms-btn" data-mode="advanced">Advanced</button>
          </div>
          <button class="btn btn-ghost" id="btn-console" title="Job console">
            <span data-ico="terminal"></span>
            <span class="btn-label">Console</span>
            <span class="badge" id="badge-running" hidden>0</span>
          </button>
          <div class="topbar-logo" title="SCM Workbench">
            <img src="/ui/logo.svg" alt="SCM Workbench">
          </div>
        </div>
      </header>

      <div class="page-scroll">
        <div class="page" id="page"></div>
      </div>
    </main>
  </div>

  <!-- ============ job console (bottom drawer) ============ -->
  <section class="console" id="console" hidden>
    <header class="console-head">
      <div class="console-title"><span data-ico="terminal"></span> Job console</div>
      <div class="console-tabs" id="console-tabs"></div>
      <div class="console-actions">
        <button class="btn btn-ghost btn-sm" id="console-copy" title="Copy log"><span data-ico="copy"></span>Copy</button>
        <button class="btn btn-ghost btn-sm" id="console-reveal" title="Reveal output location"><span data-ico="folder"></span>Reveal</button>
        <button class="btn btn-ghost btn-sm" id="console-kill" title="Stop the running job"><span data-ico="stop"></span>Stop</button>
        <button class="btn btn-ghost btn-sm" id="console-close" title="Close (esc)"><span data-ico="x"></span>Close</button>
      </div>
    </header>
    <div class="console-body">
      <pre class="console-log" id="console-log"></pre>
    </div>
    <footer class="console-foot" id="console-foot"></footer>
  </section>

  <!-- toasts -->
  <div class="toasts" id="toasts"></div>

  <!-- generic modal -->
  <div class="modal-root" id="modal-root" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal" role="dialog" aria-modal="true"></div>
  </div>

  <script type="module" src="/ui/js/app.js"></script>
</body>
</html>
