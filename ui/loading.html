<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #14161c;
    color: #c9d4e5;
    font: 14px/1.6 system-ui, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .box { text-align: center; }
  .mark {
    width: 46px; height: 46px; margin: 0 auto 14px;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .d { opacity: .8; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 1; } }
  code { opacity: .7; font-size: 12px; }
</style>
</head>
<body>
<div class="box">
  <img class="mark" src="/ui/logo.svg" alt="">
  <div class="d">Starting the SCM Workbench server…</div>
</div>
</body>
</html>
