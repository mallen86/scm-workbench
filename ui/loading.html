<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #14161c;
    color: #c9d4e5;
    font: 14px/1.6 system-ui, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .box { text-align: center; }
  .mark {
    width: 46px; height: 46px; margin: 0 auto 14px;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .d { opacity: .8; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 1; } }
  code { opacity: .7; font-size: 12px; }
</style>
</head>
<body>
<div class="box">
  <img class="mark" src="/ui/logo.svg" alt="">
  <div class="d">Starting the SCM Workbench server…</div>
</div>
</body>
</html>
  <script>
    // The shell takes this window to the worker's origin the moment the
    // worker answers; normally this page never notices it is still here.
    // If it is after a long wait, the navigation never happened - on macOS
    // that state has a name, so say it instead of pulsing forever.
    (function () {
      var waited = 0;
      var timer = setInterval(function () {
        waited += 1;
        if (waited >= 120) {
          clearInterval(timer);
          document.querySelector(".d").textContent =
            "This window is waiting for the app's own server, and it never " +
            "arrived. Quit SCM Workbench (completely) and open it again. If " +
            "that does not fix it, see \u201CFirst run on Mac\u201D in the " +
            "README - on current macOS the window needs the app allowed under " +
            "System Settings \u2192 Privacy & Security, and a fresh " +
            "allow can take one full re-open.";
        }
      }, 500);
    })();
  </script>
</body>
