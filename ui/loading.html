<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #14161c;
    color: #c9d4e5;
    font: 14px/1.6 system-ui, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .box { text-align: center; }
  .mark {
    width: 46px; height: 46px; margin: 0 auto 14px;
    border-radius: 10px;
    background: linear-gradient(135deg, #5b8cff, #9a6bff);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .d { opacity: .8; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 1; } }
  small { display: block; margin-top: 8px; opacity: .45; font-size: 12px; }
  code { opacity: .7; font-size: 12px; }
</style>
</head>
<body>
<div class="box">
  <div class="mark"></div>
  <div class="d">Starting the SCM Workbench server…</div>
  <small>this happens once per launch and takes a few seconds</small>
</div>
</body>
</html>
