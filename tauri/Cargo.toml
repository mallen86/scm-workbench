[package]
name = "scm-workbench"
version = "0.3.0"
description = "SCM Workbench — native window (Tauri) over the local UI server"
authors = ["Michael Allen <mtallen@outlook.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
