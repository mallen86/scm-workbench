name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest  # Apple silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Pin the version from the release tag
        # The tag (vX.Y.Z) becomes the app's reported version and the
        # bundle's metadata (Info.plist, exe FileVersion) in one stroke;
        # dispatch/test runs keep the declared [project] version.
        run: python scripts/inject_version.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the Tauri shell
        # The same Rust as the Windows build: on macOS the window is the
        # system WKWebView (nothing to install, in-OS) and the app spawns
        # its worker exactly as Windows does. --features custom-protocol
        # (the cargo-tauri-build flag) makes the initial page load from
        # the embedded assets instead of the dev URL.
        run: cd tauri && cargo build --release --features custom-protocol
      - name: Bake the bundled runtime
        # Fetches the pinned pbs archive for this platform, unpacks it into
        # the bundle and pip-bakes silhouette-card-maker's dependencies into
        # it (Windows-only packages dropped on macOS - see the script), so
        # first launch downloads only the managed repo copies.
        run: python scripts/bake_runtime.py --bundle build/macos
      - name: Assemble the .app
        run: |
          set -euo pipefail
          ws="$GITHUB_WORKSPACE"
          bundle="$ws/build/macos"
          app="$bundle/SCM Workbench.app"
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$app/app"
          # The flat mac layout: the standard Contents/ tree plus the app's
          # code (app/) and the runtime, all inside the bundle, so a moved
          # or renamed .app keeps working.
          cp "$ws/tauri/target/release/scm-workbench" "$app/Contents/MacOS/SCM Workbench"
          cp -R "$ws/scm_workbench" "$app/app/scm_workbench"
          cp -R "$ws/ui" "$app/app/ui"
          mv "$bundle/runtime" "$app/runtime"
          rm -rf "$bundle/.bake"
          # The icon: one .iconset from the shared 1024px source, iconutil
          # does the .icns. The directory must be named <name>.iconset -
          # a bare ".iconset" (empty name) is rejected by iconutil.
          iconset="$ws/AppIcon.iconset"
          rm -rf "$iconset" && mkdir -p "$iconset"
          src="$ws/tauri/icons/icon.png"
          sips -z 16 16     "$src" --out "$iconset/icon_16x16.png" >/dev/null
          sips -z 32 32     "$src" --out "$iconset/icon_16x16@2x.png" >/dev/null
          sips -z 32 32     "$src" --out "$iconset/icon_32x32.png" >/dev/null
          sips -z 64 64     "$src" --out "$iconset/icon_32x32@2x.png" >/dev/null
          sips -z 128 128   "$src" --out "$iconset/icon_128x128.png" >/dev/null
          sips -z 256 256   "$src" --out "$iconset/icon_128x128@2x.png" >/dev/null
          sips -z 256 256   "$src" --out "$iconset/icon_256x256.png" >/dev/null
          sips -z 512 512   "$src" --out "$iconset/icon_256x256@2x.png" >/dev/null
          sips -z 512 512   "$src" --out "$iconset/icon_512x512.png" >/dev/null
          sips -z 1024 1024 "$src" --out "$iconset/icon_512x512@2x.png" >/dev/null
          if ! iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"; then
            # leave the log the answer next time: what is actually in the
            # iconset, and each file's true pixel dimensions
            echo "iconutil rejected the iconset - contents:" >&2
            ls -la "$iconset" >&2
            for f in "$iconset"/*.png; do
              echo "$(basename "$f"): $(sips -g pixelWidth -g pixelHeight -g hasAlpha "$f" 2>/dev/null | grep -E 'pixel|alpha' | tr '\n' ' ')" >&2
            done
            exit 1
          fi
          # The Info.plist: the bundle's identity (identifier + version
          # straight from the pinned tauri.conf.json, so the About panel
          # matches the app's reported version), the icon, and the WKWebView
          # opt-in that current macOS requires for plain-HTTP loopback
          # (the UI is served by the app's own worker, so *local*
          # networking is the only rule it needs). The template lives in the
          # repo; sed fills the version.
          version=$(python3 -c "import json; print(json.load(open('$ws/tauri/tauri.conf.json'))['version'])")
          sed "s/__VERSION__/$version/" "$ws/tauri/Info.plist.template" > "$app/Contents/Info.plist"
      - name: Sign the bundle (ad-hoc)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build/macos"
          app="SCM Workbench.app"
          # Apple silicon refuses to execute unsigned code at all: ad-hoc
          # sign every Mach-O in the bundled runtime (the pbs interpreter
          # plus the pip-installed extension modules - some PyPI mac wheels
          # ship unsigned) and the bundle itself. A Developer ID +
          # notarization is the upgrade path when one is available; until
          # then the user right-clicks the app and chooses Open once.
          find "$app/runtime" -type f | while IFS= read -r f; do
            case "$(file -b "$f")" in
              *Mach-O*) codesign --force --sign - "$f" 2>/dev/null || true ;;
            esac
          done
          codesign --force --deep --sign - "$app"
      - name: Smoke test - the bundle's window must serve the UI
        # The whole point of the new architecture, verified in CI: the app
        # comes up, its worker answers on 127.0.0.1:8038, and the app's
        # own /api/info is what the user would see. NO_BOOTSTRAP keeps the
        # test hermetic (no 570 MB repo clone in a CI run). Before the
        # launch, the bundled runtime must import the core job dependencies -
        # that is what "self-contained" means, and on arm64 it also proves
        # the ad-hoc signing made the extension modules loadable.
        run: |
          set -uo pipefail
          ws="$GITHUB_WORKSPACE"
          app="$ws/build/macos/SCM Workbench.app"
          "$app/runtime/python/install/bin/python3.13" -c "import PIL, ezdxf, pypdfium2, bs4, numpy, matplotlib; print('smoke: the bundled runtime imports its job dependencies')"
          data="$(mktemp -d)/scm-data"
          export SCM_WORKBENCH_DATA="$data"
          export SCM_WORKBENCH_NO_BOOTSTRAP=1
          "$app/Contents/MacOS/SCM Workbench" > "$ws/build/macos/smoke.log" 2>&1 &
          app_pid=$!
          ok=""
          for i in $(seq 1 90); do
            sleep 1
            if curl -sf "http://127.0.0.1:8038/api/info" 2>/dev/null | grep -q '"server"'; then
              ok=1
              echo "smoke: the UI answered on 127.0.0.1:8038"
              break
            fi
          done
          kill "$app_pid" 2>/dev/null || true
          # the worker is the window's child; the hard kill above orphans it,
          # so collect the bundle's runtime explicitly
          pkill -f "$app/runtime/python" 2>/dev/null || true
          if [ -z "$ok" ]; then
            echo "---- smoke.log ----"; cat "$ws/build/macos/smoke.log" || true
            echo "---- server log ----"; cat "$data/server-tauri.log" 2>/dev/null || true
            exit 1
          fi
      - name: Zip
        run: |
          cd "$GITHUB_WORKSPACE/build/macos"
          zip -qr scm-workbench-macos.zip "SCM Workbench.app"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scm-workbench-macos
          path: build/macos/scm-workbench-macos.zip
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Pin the version from the release tag
        # On a tag push GITHUB_REF_NAME is the tag (v0.3.0) - it becomes the
        # Python side's __version__, the Tauri conf/Cargo version and the
        # exe's stamped metadata at once. Dispatch/test runs keep the
        # [project] version declared in the repo.
        run: python scripts/inject_version.py
      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
      - name: Build the Tauri shell
        # --features custom-protocol is what `cargo tauri build` passes: it
        # makes Tauri serve the window's initial page from its embedded asset
        # protocol instead of the dev URL, so the splash shows instantly
        # without the worker's port existing yet (no "can't reach" flash).
        working-directory: tauri
        run: cargo build --release --features custom-protocol
      - name: Fetch the pinned runtime and bake the job dependencies into it
        # The exact python-build-standalone archive the launcher would fetch
        # on a user's first boot (name imported, not re-spelled), unpacked
        # into the bundle, with the managed repos' requirements pip-installed
        # in. The shipped bundle is self-contained: first launch downloads
        # nothing but the managed repo copies themselves.
        run: python scripts/bake_runtime.py --bundle build\windows
      - name: Assemble the bundle
        # The flat layout a first-boot user sees: the exe at the root, the
        # app code in app/ (where the worker's PYTHONPATH points), the
        # runtime beside them. The per-user data area is created by the
        # app at launch - it is never part of the bundle.
        run: |
          $ws = (Resolve-Path .).Path
          $bundle = Join-Path $ws "build\windows"
          Copy-Item (Join-Path $ws "tauri\target\release\scm-workbench.exe") (Join-Path $bundle "SCM Workbench.exe")
          New-Item -ItemType Directory -Force (Join-Path $bundle "app") | Out-Null
          Copy-Item (Join-Path $ws "scm_workbench") (Join-Path $bundle "app\scm_workbench") -Recurse
          Copy-Item (Join-Path $ws "ui") (Join-Path $bundle "app\ui") -Recurse
          # The bake's scratch dir (the requirements clones live there briefly)
          # must not ship inside the bundle:
          Remove-Item -Recurse -Force (Join-Path $bundle ".bake") -ErrorAction SilentlyContinue
          Get-ChildItem $bundle | Select-Object Name, Length
      - name: Smoke test - the bundle's window must serve the UI
        # The whole point of the new architecture, verified in CI: the exe
        # comes up, its worker answers on 127.0.0.1:8038, and the app's
        # own /api/info is what the user would see. NO_BOOTSTRAP keeps the
        # test hermetic (no 570 MB repo clone in a CI run).
        run: |
          $ws = (Resolve-Path .).Path
          $env:SCM_WORKBENCH_DATA = Join-Path $env:RUNNER_TEMP "wb-smoke-data"
          $env:SCM_WORKBENCH_NO_BOOTSTRAP = "1"
          $proc = Start-Process -FilePath (Join-Path $ws "build\windows\SCM Workbench.exe") -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 1
            try {
              $j = Invoke-RestMethod -Uri "http://127.0.0.1:8038/api/info" -TimeoutSec 2
              if ($j.server -and $j.server.version) { $ok = $true; Write-Host "smoke: the UI answered (v$($j.server.version))"; break }
            } catch { }
          }
          if (-not $ok) { throw "smoke: the UI server never answered on 127.0.0.1:8038" }
          $proc | Stop-Process -Force
          # the worker is the window's child; the hard kill above orphans it,
          # so collect the bundle's runtime explicitly
          Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" |
            Where-Object { $_.ExecutablePath -like "$ws\build\windows\runtime\*" } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
      - name: Zip
        run: |
          $app = Join-Path (Resolve-Path .).Path "build\windows"
          Compress-Archive -Path (Join-Path $app "*") -DestinationPath "$app\scm-workbench-windows.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scm-workbench-windows
          path: build/windows/scm-workbench-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Attach the built artifacts to the release
        # The release itself (title + notes) is created *outside* this
        # workflow - `gh release create vX.Y.Z --notes-file ...` right before
        # the tag push, or from the GitHub UI. This job only adds the two
        # build artifacts to it. If no release exists for the tag, a bare one
        # is created as a fallback so the artifacts are never lost.
        # (--repo on every call: this job has no checkout for gh to infer
        #  the owner/repo from.)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "SCM Workbench $GITHUB_REF_NAME - add release notes in the release editor"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" scm-workbench-macos.zip scm-workbench-windows.zip --clobber
