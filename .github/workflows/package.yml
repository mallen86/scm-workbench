name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Briefcase
        run: python -m pip install --upgrade pip briefcase
      - name: Pin the version from the release tag
        # On a tag push GITHUB_REF_NAME is the tag (v0.1.1) - that single
        # string becomes the bundle's Info.plist version, the dist-info and
        # the app's own __version__/SERVER_VERSION, so the About box, the
        # in-UI version and the updater's "current" can never disagree.
        # Dispatch/test runs keep the [project] version declared in the repo.
        run: python scripts/inject_version.py
      - name: Build the .app
        env:
          # pywebview unconditionally depends on proxy_tools, whose only
          # PyPI release is a ~2015 sdist that pip's resolver intermittently
          # refuses (no versions found) on macOS runners. A prebuilt
          # py3-none-any wheel of it is vendored in ciwheels/ and pip finds
          # it via this find-links path instead of the flaky index entry.
          PIP_FIND_LINKS: file://${{ github.workspace }}/ciwheels
        run: briefcase build macos app
      - name: Allow the app's webview to load its own local server
        run: |
          cd build/scm-workbench/macos/app
          # Current macOS versions block plain-HTTP loopback traffic inside
          # WKWebView unless the app opts in (and macOS 15+ also shows a
          # Local Network permission prompt otherwise). The Workbench's UI is
          # served by its own bundled server, so allow *local* networking and
          # re-sign the bundle (ad-hoc; replace with a Developer ID for release).
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "SCM Workbench.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool TRUE" "SCM Workbench.app/Contents/Info.plist"
          # About-panel hygiene: the template's CFBundleVersion would show as a
          # second number next to the real one ("Version 0.1.0 (1)") - drop it,
          # and put a proper one-liner in the copyright slot.
          /usr/libexec/PlistBuddy -c "Delete :CFBundleVersion" "SCM Workbench.app/Contents/Info.plist"
          # the template ships no copyright key - Add creates it (Set would fail);
          # the Set fallback covers any template that ever does ship one
          /usr/libexec/PlistBuddy -c "Add :NSHumanReadableCopyright string Thanks to Alan Cha for silhouette-card-maker and scm-extras." "SCM Workbench.app/Contents/Info.plist" \
            || /usr/libexec/PlistBuddy -c "Set :NSHumanReadableCopyright Thanks to Alan Cha for silhouette-card-maker and scm-extras." "SCM Workbench.app/Contents/Info.plist"
          codesign --force --deep -s - "SCM Workbench.app"
      - name: Zip
        run: |
          cd build/scm-workbench/macos/app
          zip -qr scm-workbench-macos.zip "SCM Workbench.app"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scm-workbench-macos
          path: build/scm-workbench/macos/app/scm-workbench-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Briefcase
        run: python -m pip install --upgrade pip briefcase
      - name: Pin the version from the release tag
        run: python scripts/inject_version.py
      - name: Build the app folder
        run: |
          # same vendored-wheel story as the macOS job (PIP_FIND_LINKS must
          # be a file:// URL with forward slashes on Windows)
          $ws = (Resolve-Path .).Path.Replace('\', '/')
          $env:PIP_FIND_LINKS = "file:///$ws/ciwheels"
          briefcase build windows app
      - name: Zip
        run: |
          cd build/scm-workbench/windows/app
          Compress-Archive -Path * -DestinationPath ../scm-workbench-windows.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scm-workbench-windows
          path: build/scm-workbench/windows/scm-workbench-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            scm-workbench-macos.zip
            scm-workbench-windows.zip
          body: |
            First release of SCM Workbench — a local, self-contained UI for
            silhouette-card-maker and scm-extras.

            * **macOS** — unzip and open “SCM Workbench.app”. The build is
              unsigned, so the first launch needs a right-click → *Open*.
            * **Windows** — unzip and run “SCM Workbench.exe”.

            First launch provisions the app's private Python runtime and
            fetches the newest copy of each sister repo (watch the progress
            in the app's window). Nothing is installed on the machine —
            everything lives in the app's data folder.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
