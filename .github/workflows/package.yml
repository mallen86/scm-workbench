name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest  # Apple silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - name: Guard — every UI import must resolve
        # The v0.3.2–v0.3.4 blank-window failure: page modules imported
        # their shared dependencies from the wrong directory, the worker
        # 404'd them as JSON, WebKit refused the MIME type, and the whole
        # UI died after the nav shell painted. The worker serves the UI
        # fine and /api/info answers — the old smoke test never looked at
        # the modules, so this check is the gate: no unresolvable import
        # specifier reaches a build.
        run: python scripts/check_ui_imports.py
      - name: Pin the version from the release tag
        # The tag (vX.Y.Z) becomes the app's reported version and the
        # bundle's metadata (Info.plist, exe FileVersion) in one stroke;
        # dispatch/test runs keep the declared [project] version.
        run: python scripts/inject_version.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the Tauri shell
        # The same Rust as the Windows build: on macOS the window is the
        # system WKWebView (nothing to install, in-OS) and the app spawns
        # its worker exactly as Windows does. --features custom-protocol
        # (the cargo-tauri-build flag) makes the initial page load from
        # the embedded assets instead of the dev URL.
        run: cd tauri && cargo build --release --features custom-protocol
      - name: Bake the bundled runtime
        # Fetches the pinned pbs archive for this platform, unpacks it into
        # the bundle and pip-bakes silhouette-card-maker's dependencies into
        # it (Windows-only packages dropped on macOS - see the script), so
        # first launch downloads only the managed repo copies.
        run: python scripts/bake_runtime.py --bundle build/macos
      - name: Assemble the .app
        run: |
          set -euo pipefail
          ws="$GITHUB_WORKSPACE"
          bundle="$ws/build/macos"
          app="$bundle/SCM Workbench.app"
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$app/Contents/app"
          # Everything lives under Contents/: an app bundle's code-signature
          # seal covers exactly that tree, and codesign refuses to sign a
          # bundle that carries anything else at its root - so the payload
          # (the app's code and the runtime) goes inside Contents/, and a
          # moved or renamed .app keeps working.
          cp "$ws/tauri/target/release/scm-workbench" "$app/Contents/MacOS/SCM Workbench"
          cp -R "$ws/scm_workbench" "$app/Contents/app/scm_workbench"
          cp -R "$ws/ui" "$app/Contents/app/ui"
          mv "$bundle/runtime" "$app/Contents/runtime"
          rm -rf "$bundle/.bake"
          # The icon: one .iconset from the shared 1024px source, iconutil
          # does the .icns. The directory must be named <name>.iconset -
          # a bare ".iconset" (empty name) is rejected by iconutil.
          iconset="$ws/AppIcon.iconset"
          rm -rf "$iconset" && mkdir -p "$iconset"
          src="$ws/tauri/icons/icon.png"
          sips -z 16 16     "$src" --out "$iconset/icon_16x16.png" >/dev/null
          sips -z 32 32     "$src" --out "$iconset/icon_16x16@2x.png" >/dev/null
          sips -z 32 32     "$src" --out "$iconset/icon_32x32.png" >/dev/null
          sips -z 64 64     "$src" --out "$iconset/icon_32x32@2x.png" >/dev/null
          sips -z 128 128   "$src" --out "$iconset/icon_128x128.png" >/dev/null
          sips -z 256 256   "$src" --out "$iconset/icon_128x128@2x.png" >/dev/null
          sips -z 256 256   "$src" --out "$iconset/icon_256x256.png" >/dev/null
          sips -z 512 512   "$src" --out "$iconset/icon_256x256@2x.png" >/dev/null
          sips -z 512 512   "$src" --out "$iconset/icon_512x512.png" >/dev/null
          sips -z 1024 1024 "$src" --out "$iconset/icon_512x512@2x.png" >/dev/null
          if ! iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"; then
            # leave the log the answer next time: what is actually in the
            # iconset, and each file's true pixel dimensions
            echo "iconutil rejected the iconset - contents:" >&2
            ls -la "$iconset" >&2
            for f in "$iconset"/*.png; do
              echo "$(basename "$f"): $(sips -g pixelWidth -g pixelHeight -g hasAlpha "$f" 2>/dev/null | grep -E 'pixel|alpha' | tr '\n' ' ')" >&2
            done
            exit 1
          fi
          # The Info.plist: the bundle's identity (identifier + version
          # straight from the pinned tauri.conf.json, so the About panel
          # matches the app's reported version), the icon, and the WKWebView
          # opt-in that current macOS requires for plain-HTTP loopback
          # (the UI is served by the app's own worker, so *local*
          # networking is the only rule it needs). The template lives in the
          # repo; sed fills the version.
          version=$(python3 -c "import json; print(json.load(open('$ws/tauri/tauri.conf.json'))['version'])")
          sed "s/__VERSION__/$version/" "$ws/tauri/Info.plist.template" > "$app/Contents/Info.plist"
      - name: Sign the bundle (ad-hoc)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build/macos"
          app="SCM Workbench.app"
          # Apple silicon refuses to execute unsigned code at all: ad-hoc
          # sign every Mach-O in the bundled runtime (the pbs interpreter
          # plus the pip-installed extension modules - some PyPI mac wheels
          # ship unsigned) and the bundle itself. A Developer ID +
          # notarization is the upgrade path when one is available; until
          # then a downloaded (quarantined) copy can't pass Gatekeeper at
          # all - the first launch is one "Open Anyway" for the app itself
          # in System Settings → Privacy & Security, remembered by the
          # machine. (Tested on macOS 26: a companion script gets gated the
          # same way even ad-hoc signed, so no helper is shipped - the
          # app's own allow is the whole flow.) Only a Developer ID
          # signature + notarization removes the step.
          find "$app/Contents/runtime" -type f | while IFS= read -r f; do
            case "$(file -b "$f")" in
              *Mach-O*) codesign --force --sign - "$f" 2>/dev/null || true ;;
            esac
          done
          codesign --force --deep --sign - "$app"
      - name: Smoke test - the window's webview must be on the UI
        # The piece three releases shipped broken: the worker answered, the
        # webview never reached it, and nothing in CI looked at the webview.
        # (The old smoke curled /api/info - that proves the *worker*, not
        # the *window*.) The shape of the proof: only a real WebKit session
        # sends a WebKit User-Agent, so a WebKit UA on the worker's request
        # log is the marker that a human would see the UI. Two failures,
        # named: the worker never binds (the old check), and the worker
        # serves but no webview ever connects (the blank-window class -
        # exactly what the user saw on v0.3.2 through v0.3.4: a healthy
        # server log next to a window stuck on its splash). NO_BOOTSTRAP
        # keeps the test hermetic (no 570 MB repo clone in a CI run). Before
        # the launch, the bundled runtime must import the core job
        # dependencies - that is what "self-contained" means, and on arm64
        # it also proves the ad-hoc signing made the extension modules
        # loadable.
        #
        # The payload (app/, runtime/) lives under Contents/ - inside the
        # code-signature seal the Sign step made. Anything that runs from
        # there (and anything it wakes) can write back into that sealed
        # tree after the seal was made; the Re-seal step below folds such
        # writes into a fresh seal, and the zip gate verifies the archived
        # bytes - so a download can never carry a seal the tree no longer
        # matches. This run is kept write-free where possible (the env var
        # stops the pyc compiles, the precheck and the worker included).
        run: |
          set -uo pipefail
          ws="$GITHUB_WORKSPACE"
          app="$ws/build/macos/SCM Workbench.app"
          export PYTHONDONTWRITEBYTECODE=1
          "$app/Contents/runtime/python/install/bin/python3.13" -c "import PIL, ezdxf, pypdfium2, bs4, numpy, matplotlib; print('smoke: the bundled runtime imports its job dependencies')"
          data="$(mktemp -d)/scm-data"
          export SCM_WORKBENCH_DATA="$data"
          export SCM_WORKBENCH_NO_BOOTSTRAP=1
          "$app/Contents/MacOS/SCM Workbench" > "$ws/build/macos/smoke.log" 2>&1 &
          app_pid=$!
          worker_ok=""
          webview_ok=""
          for i in $(seq 1 90); do
            sleep 1
            if [ -z "$worker_ok" ] && curl -sf "http://127.0.0.1:8038/api/info" 2>/dev/null | grep -q '"server"'; then
              worker_ok=1
              echo "smoke: the worker answers on 127.0.0.1:8038"
            fi
            # The worker logs a marker line at request time when a WebKit
            # session loads its index (server.py, / GET): that marker is
            # what this check greps for. A curl in this same loop loads /
            # with curl's own agent, so it cannot produce the marker.
            if [ -n "$worker_ok" ] && [ -z "$webview_ok" ] \
               && grep -q "webview session on / (WebKit)" "$data/server-tauri.log" 2>/dev/null; then
              webview_ok=1
              echo "smoke: the window's webview is on the UI (a WebKit connection hit the worker)"
              break
            fi
          done
          # A *soft* kill here is deliberate for the smoke test: it exercises the
          # normal CloseRequested path (the window closes cleanly). The separate
          # "Reap check" step below is what proves the hard-kill path reaps too.
          kill "$app_pid" 2>/dev/null || true
          if [ -z "$worker_ok" ]; then
            echo "---- smoke.log ----"; cat "$ws/build/macos/smoke.log" || true
            echo "---- server log ----"; cat "$data/server-tauri.log" 2>/dev/null || true
            echo "smoke FAILED: the worker never answered" >&2
            exit 1
          fi
          if [ -z "$webview_ok" ]; then
            echo "---- smoke.log ----"; cat "$ws/build/macos/smoke.log" || true
            echo "---- server log (last 40) ----"; tail -40 "$data/server-tauri.log" 2>/dev/null || true
            echo "smoke FAILED: the worker serves, but no webview ever reached it" >&2
            echo "              (the blank-window failure the user would see - not shippable)" >&2
            exit 1
          fi
          echo "smoke: worker up AND the webview is on the page - the UI the user gets"
      - name: Reap check - a hard-killed app must not orphan its worker
        # The inverse of the blank-window class: a worker that outlives the app
        # (PPID 1, port still held) wedges the *next* launch. The old smoke
        # cleaned up with a soft kill and then had to pkill the runtime by
        # hand - the comment there literally says "the hard kill above orphans
        # it". That is now the failure mode we refuse: hard-kill the shell and
        # assert the worker reaped itself, with no manual pkill to rescue it.
        run: |
          set -uo pipefail
          ws="$GITHUB_WORKSPACE"
          app="$ws/build/macos/SCM Workbench.app"
          export PYTHONDONTWRITEBYTECODE=1
          data="$(mktemp -d)/scm-data"
          export SCM_WORKBENCH_DATA="$data"
          export SCM_WORKBENCH_NO_BOOTSTRAP=1
          "$app/Contents/MacOS/SCM Workbench" > "$ws/build/macos/reap.log" 2>&1 &
          app_pid=$!
          # wait (bounded, ~5s is plenty - the worker binds in well under a
          # second) for the worker to come up on the loopback port
          worker_ok=""
          for i in $(seq 1 10); do
            sleep 0.5
            if curl -sf "http://127.0.0.1:8038/api/info" 2>/dev/null | grep -q '"server"'; then worker_ok=1; break; fi
          done
          if [ -z "$worker_ok" ]; then
            # A worker that never comes up is a *startup* problem - the smoke
            # step above already covers that class and would have failed the
            # run. We can't prove reaping without a live worker, so report and
            # move on rather than mask a startup regression as "reaping failed".
            echo "---- reap.log ----"; cat "$ws/build/macos/reap.log" 2>/dev/null || true
            echo "reap: SKIPPED - the worker never came up on its own, so there is nothing to reap (startup is covered by the smoke step above)"
            kill -9 "$app_pid" 2>/dev/null || true
            exit 0
          fi
          # the whole point: HARD-kill the shell (the Activity-Monitor case) and
          # confirm the worker is gone on its own. No pkill in between.
          kill -9 "$app_pid" 2>/dev/null || true
          # give the shell's exit a beat to run its teardown
          sleep 1
          # the worker is the bundle's runtime python running scm_workbench.server
          if pgrep -f "$app/Contents/runtime/python" >/dev/null 2>&1; then
            echo "reap FAILED: a worker outlived the hard-killed app (it would orphan to init and wedge the next launch)" >&2
            pgrep -fl "$app/Contents/runtime/python" >&2 || true
            exit 1
          fi
          if curl -sf "http://127.0.0.1:8038/api/info" >/dev/null 2>&1; then
            echo "reap FAILED: the worker still answers on 8038 after the app died" >&2
            exit 1
          fi
          echo "reap: hard-killed the app, the worker reaped itself, the port is free - no orphan"
      - name: Re-seal the bundle after the smoke test
        # The smoke run is the last thing that executes from the bundle, and
        # a straggler it wakes can keep writing after the Sign step's seal.
        # (The v0.3.0 zip is the standing example: nine pbs runtime files -
        # bin/python{,3,-config}, idle3, pydoc3, both .pc files, libpython's
        # .a and the man page - were re-written from the pbs archive *after*
        # the seal, so the zipped bundle read "damaged" on every machine.)
        # Re-sign now, whatever has landed is inside the fresh seal; the
        # marker moves to this seal, and the zip gate below judges the
        # archived bytes against it - and names the writer on failure.
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build/macos"
          sleep 5  # let in-flight writers land before the seal, not after
          codesign --force --deep --sign - "SCM Workbench.app"
          rm -f sign-marker && touch sign-marker
      - name: Zip
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build/macos"
          # The zip carries the app alone, at its root: no wrapper folder,
          # no companion script. (An earlier revision shipped a
          # "First run on Mac" beside it; the quarantine gates that
          # file the same way it gates the app, so it was a second
          # P&S-allow in disguise and got dropped.) The first launch is
          # one "Open Anyway" for the app itself in System Settings →
          # Privacy & Security, remembered by the machine; a Developer ID
          # + notarization is the only way to make that click disappear.
          #
          # -y is load-bearing, not stylistic: the pbs runtime carries
          # symlinks (bin/python → python3.13, the pkgconfig aliases, the
          # libpython version link, …) and the seal hashes them *as links*.
          # Plain `zip -r` follows them and stores the *target's* bytes
          # under the link's name (bin/python becomes a 17 MB Mach-O), so
          # every machine that unzips it sees a seal its own files no
          # longer match - "damaged", with no button. That is precisely
          # what broke every mac zip of this architecture until -y.
          zip -y -qr scm-workbench-macos.zip "SCM Workbench.app"
      - name: Verify what the zip actually ships
        # The checks above read the bundle's tree as it stood *then*; the
        # seal that matters is on the zip's own bytes. This step has caught
        # both failure classes this pipeline has had: writes that land in
        # the sealed tree after the last seal (a broken pre-zip snapshot),
        # and the zip's own encoding diverging from the tree it archived
        # (the symlink dereferencing above - where the disk was pristine
        # and only the archive lied). Unpack the artifact and verify it; on
        # failure, dump the violations and any bundle file newer than the
        # re-seal's marker, so the next red build points at its cause.
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build/macos"
          mkdir -p .zipcheck
          unzip -q scm-workbench-macos.zip -d .zipcheck
          app=".zipcheck/SCM Workbench.app"
          if ! codesign --verify --verbose=2 "$app" > .zipcheck/verify.log 2>&1; then
            echo "---- the zipped bundle fails codesign --verify: ----"
            cat .zipcheck/verify.log
            echo "---- bundle files written after the last seal (the writer's footprint): ----"
            find "$app" -newer sign-marker 2>/dev/null | sed "s|^$app/||" | head -50
            exit 1
          fi
          echo "the zipped bundle verifies clean: what ships is what the signature covers"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scm-workbench-macos
          path: build/macos/scm-workbench-macos.zip
          # The release job consumes the artifact in the same minutes, so a
          # 1-day retention is plenty; it also keeps the account's 500 MB
          # free artifact-storage allowance from filling up with a ~180 MB
          # zip per platform per run for the full 90-day default. (Valid
          # range: 1-90; 0 = repo default.)
          retention-days: 1
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Pin the version from the release tag
        # On a tag push GITHUB_REF_NAME is the tag (v0.3.0) - it becomes the
        # Python side's __version__, the Tauri conf/Cargo version and the
        # exe's stamped metadata at once. Dispatch/test runs keep the
        # [project] version declared in the repo.
        run: python scripts/inject_version.py
      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
      - name: Build the Tauri shell
        # --features custom-protocol is what `cargo tauri build` passes: it
        # makes Tauri serve the window's initial page from its embedded asset
        # protocol instead of the dev URL, so the splash shows instantly
        # without the worker's port existing yet (no "can't reach" flash).
        working-directory: tauri
        run: cargo build --release --features custom-protocol
      - name: Fetch the pinned runtime and bake the job dependencies into it
        # The exact python-build-standalone archive the launcher would fetch
        # on a user's first boot (name imported, not re-spelled), unpacked
        # into the bundle, with the managed repos' requirements pip-installed
        # in. The shipped bundle is self-contained: first launch downloads
        # nothing but the managed repo copies themselves.
        run: python scripts/bake_runtime.py --bundle build\windows
      - name: Assemble the bundle
        # The flat layout a first-boot user sees: the exe at the root, the
        # app code in app/ (where the worker's PYTHONPATH points), the
        # runtime beside them. The per-user data area is created by the
        # app at launch - it is never part of the bundle.
        run: |
          $ws = (Resolve-Path .).Path
          $bundle = Join-Path $ws "build\windows"
          Copy-Item (Join-Path $ws "tauri\target\release\scm-workbench.exe") (Join-Path $bundle "SCM Workbench.exe")
          New-Item -ItemType Directory -Force (Join-Path $bundle "app") | Out-Null
          Copy-Item (Join-Path $ws "scm_workbench") (Join-Path $bundle "app\scm_workbench") -Recurse
          Copy-Item (Join-Path $ws "ui") (Join-Path $bundle "app\ui") -Recurse
          # The bake's scratch dir (the requirements clones live there briefly)
          # must not ship inside the bundle:
          Remove-Item -Recurse -Force (Join-Path $bundle ".bake") -ErrorAction SilentlyContinue
          Get-ChildItem $bundle | Select-Object Name, Length
      - name: Smoke test - the bundle's window must serve the UI
        # The whole point of the new architecture, verified in CI: the exe
        # comes up, its worker answers on 127.0.0.1:8038, and the app's
        # own /api/info is what the user would see. NO_BOOTSTRAP keeps the
        # test hermetic (no 570 MB repo clone in a CI run).
        run: |
          $ws = (Resolve-Path .).Path
          $env:SCM_WORKBENCH_DATA = Join-Path $env:RUNNER_TEMP "wb-smoke-data"
          $env:SCM_WORKBENCH_NO_BOOTSTRAP = "1"
          $proc = Start-Process -FilePath (Join-Path $ws "build\windows\SCM Workbench.exe") -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 1
            try {
              $j = Invoke-RestMethod -Uri "http://127.0.0.1:8038/api/info" -TimeoutSec 2
              if ($j.server -and $j.server.version) { $ok = $true; Write-Host "smoke: the UI answered (v$($j.server.version))"; break }
            } catch { }
          }
          if (-not $ok) { throw "smoke: the UI server never answered on 127.0.0.1:8038" }
          $proc | Stop-Process -Force
          # the worker is the window's child; the hard kill above orphans it,
          # so collect the bundle's runtime explicitly
          Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" |
            Where-Object { $_.ExecutablePath -like "$ws\build\windows\runtime\*" } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
      - name: Zip
        run: |
          $app = Join-Path (Resolve-Path .).Path "build\windows"
          Compress-Archive -Path (Join-Path $app "*") -DestinationPath "$app\scm-workbench-windows.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scm-workbench-windows
          path: build/windows/scm-workbench-windows.zip
          retention-days: 1  # see the macos step above

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Attach the built artifacts to the release
        # The release itself (title + notes) is created *outside* this
        # workflow - `gh release create vX.Y.Z --notes-file ...` right before
        # the tag push, or from the GitHub UI. This job only adds the two
        # build artifacts to it. If no release exists for the tag, a bare one
        # is created as a fallback so the artifacts are never lost.
        # (--repo on every call: this job has no checkout for gh to infer
        #  the owner/repo from.)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" scm-workbench-macos.zip scm-workbench-windows.zip --clobber
