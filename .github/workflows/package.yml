name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-14  # arm64 runner; Intel is intentionally not a release target
    env:
      # Keep Cargo outputs outside the checkout; frontendDist embeds only the
      # bounded ui/ tree, never repository source or build artifacts.
      CARGO_TARGET_DIR: ${{ github.workspace }}/../scm-workbench-tauri-target
    steps:
      - uses: actions/checkout@v4
      - name: Record build revision
        id: build_meta
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Assert the release architecture
        run: test "$(uname -m)" = "arm64"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python and UI transport checks
        run: |
          python -m unittest discover -s tests -v
          python -m unittest tests.test_update_handoff -v
          python scripts/check_ui_imports.py
          python scripts/check_ui_transport.py
          python scripts/check_ui_decklists.py
          python scripts/check_ui_back_images.py
          python scripts/check_ui_fetch_recents.py
          python scripts/check_ui_jobs.py
          python scripts/check_ui_repos.py
          python scripts/check_ui_onboarding.py
          python scripts/check_ui_tutorial.py
          python scripts/check_ui_preview.py
          python scripts/check_ui_pdf_preview.py
          python scripts/check_ui_artifacts.py
          python scripts/check_ui_history.py
          python scripts/check_ui_native_actions.py
          python scripts/check_ui_save.py
          python scripts/check_ui_settings.py
          python scripts/check_ui_offsets.py
          python scripts/check_ui_updates.py
          python scripts/check_ui_update_security.py
          python scripts/check_ui_fs_delete.py
          python scripts/check_tauri_embedded.py
      - name: Node syntax check — every UI module
        run: find ui/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Pin the version from the release tag
        # The tag (vX.Y.Z or vX.Y.Z-beta.N) becomes the app's reported
        # version and bundle metadata (Info.plist, exe FileVersion) in one stroke;
        # dispatch/test runs keep the declared [project] version.
        run: python scripts/inject_version.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        working-directory: tauri
        run: cargo test
      - name: Helper CLI invalid-mode smoke
        working-directory: tauri
        run: |
          if cargo run --quiet -- --update-helper --data-dir /definitely/not-canonical/../data --token aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --mode invalid; then
            echo "invalid helper mode was accepted" >&2
            exit 1
          fi
      - name: Build the Tauri shell
        # The same Rust as the Windows build: on macOS the window is the
        # system WKWebView (nothing to install, in-OS) and the app spawns
        # its worker exactly as Windows does. --features custom-protocol
        # (the cargo-tauri-build flag) makes the initial page load from
        # the embedded assets instead of the dev URL.
        run: cd tauri && cargo build --release --features custom-protocol
      - name: Bake the bundled runtime
        # Fetches the pinned pbs archive for this platform, unpacks it into
        # the bundle and pip-bakes silhouette-card-maker's dependencies into
        # it (Windows-only packages dropped on macOS - see the script), so
        # first launch downloads only the managed repo copies.
        run: python scripts/bake_runtime.py --bundle build/macos
      - name: Assemble the .app
        run: |
          set -euo pipefail
          ws="$GITHUB_WORKSPACE"
          bundle="$ws/build/macos"
          app="$bundle/SCM Workbench.app"
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$app/Contents/app"
          # Everything lives under Contents/: an app bundle's code-signature
          # seal covers exactly that tree, and codesign refuses to sign a
          # bundle that carries anything else at its root - so the payload
          # (the app's code and the runtime) goes inside Contents/, and a
          # moved or renamed .app keeps working.
          cp "$CARGO_TARGET_DIR/release/scm-workbench" "$app/Contents/MacOS/SCM Workbench"
          cp -R "$ws/scm_workbench" "$app/Contents/app/scm_workbench"
          cp -R "$ws/ui" "$app/Contents/app/ui"
          mkdir -p "$app/Contents/app/docs"
          cp "$ws/docs/image-postprocessing.md" "$app/Contents/app/docs/image-postprocessing.md"
          mv "$bundle/runtime" "$app/Contents/runtime"
          rm -rf "$bundle/.bake"
          # The icon: one .iconset from the shared 1024px source, iconutil
          # does the .icns. The directory must be named <name>.iconset -
          # a bare ".iconset" (empty name) is rejected by iconutil.
          iconset="$ws/AppIcon.iconset"
          rm -rf "$iconset" && mkdir -p "$iconset"
          src="$ws/tauri/icons/icon.png"
          sips -z 16 16     "$src" --out "$iconset/icon_16x16.png" >/dev/null
          sips -z 32 32     "$src" --out "$iconset/icon_16x16@2x.png" >/dev/null
          sips -z 32 32     "$src" --out "$iconset/icon_32x32.png" >/dev/null
          sips -z 64 64     "$src" --out "$iconset/icon_32x32@2x.png" >/dev/null
          sips -z 128 128   "$src" --out "$iconset/icon_128x128.png" >/dev/null
          sips -z 256 256   "$src" --out "$iconset/icon_128x128@2x.png" >/dev/null
          sips -z 256 256   "$src" --out "$iconset/icon_256x256.png" >/dev/null
          sips -z 512 512   "$src" --out "$iconset/icon_256x256@2x.png" >/dev/null
          sips -z 512 512   "$src" --out "$iconset/icon_512x512.png" >/dev/null
          sips -z 1024 1024 "$src" --out "$iconset/icon_512x512@2x.png" >/dev/null
          if ! iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"; then
            # leave the log the answer next time: what is actually in the
            # iconset, and each file's true pixel dimensions
            echo "iconutil rejected the iconset - contents:" >&2
            ls -la "$iconset" >&2
            for f in "$iconset"/*.png; do
              echo "$(basename "$f"): $(sips -g pixelWidth -g pixelHeight -g hasAlpha "$f" 2>/dev/null | grep -E 'pixel|alpha' | tr '\n' ' ')" >&2
            done
            exit 1
          fi
          # The Info.plist: the bundle's identity (identifier + version
          # straight from the pinned tauri.conf.json, so the About panel
          # matches the app's reported version), and the icon. The WebView
          # uses the embedded Tauri asset origin; the packaged worker is
          # stdio-only and requires no local-network permission. The template
          # lives in the repo; sed fills the version.
          version=$(python3 -c "import json; print(json.load(open('$ws/tauri/tauri.conf.json'))['version'])")
          sed "s/__VERSION__/$version/" "$ws/tauri/Info.plist.template" > "$app/Contents/Info.plist"
      - name: Sign the bundle (ad-hoc)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build/macos"
          app="SCM Workbench.app"
          # Apple silicon refuses to execute unsigned code at all: ad-hoc
          # sign every Mach-O in the bundled runtime (the pbs interpreter
          # plus the pip-installed extension modules - some PyPI mac wheels
          # ship unsigned) and the bundle itself. A Developer ID +
          # notarization is the upgrade path when one is available; until
          # then a downloaded (quarantined) copy can't pass Gatekeeper at
          # all - the first launch is one "Open Anyway" for the app itself
          # in System Settings → Privacy & Security, remembered by the
          # machine. (Tested on macOS 26: a companion script gets gated the
          # same way even ad-hoc signed, so no helper is shipped - the
          # app's own allow is the whole flow.) Only a Developer ID
          # signature + notarization removes the step.
          find "$app/Contents/runtime" -type f | while IFS= read -r f; do
            case "$(file -b "$f")" in
              *Mach-O*) codesign --force --sign - "$f" 2>/dev/null || true ;;
            esac
          done
          codesign --force --deep --sign - "$app"
      - name: Smoke test - embedded UI and native IPC
        # Private ready plus five public UI IPC markers are render evidence.
        # The packaged worker has no HTTP listener: port 8038 must stay closed.
        # NO_BOOTSTRAP keeps the test hermetic (no 570 MB repo clone in CI).
        run: |
          set -uo pipefail
          ws="$GITHUB_WORKSPACE"
          app="$ws/build/macos/SCM Workbench.app"
          export PYTHONDONTWRITEBYTECODE=1
          export SCM_WORKBENCH_NO_UPDATE_CHECK=1
          "$app/Contents/runtime/python/install/bin/python3.13" -c "import PIL, ezdxf, pypdfium2, bs4, numpy, matplotlib; print('smoke: the bundled runtime imports its job dependencies')"
          (cd "$app/Contents/app" && "$app/Contents/runtime/python/install/bin/python3.13" -B -c "from scm_workbench import server; result = server.postprocessor_guide(); assert result.get('ok') and '<h1>Image post-processing</h1>' in result.get('body', ''); print('smoke: bundled post-processing guide renders')")
          "$app/Contents/runtime/python/install/bin/python3.13" "$ws/scripts/check_pdf_preview_helper.py" "$app/Contents/app/scm_workbench/pdf_preview_helper.py"
          data="$(mktemp -d /private/tmp/scm-workbench-smoke.XXXXXX)/scm-data"
          export SCM_WORKBENCH_DATA="$data"
          export SCM_WORKBENCH_NO_BOOTSTRAP=1
          port_closed() {
            python3 - "$1" <<'PY'
          import socket, sys
          sock = socket.socket()
          sock.settimeout(0.2)
          try:
              sock.connect(("127.0.0.1", int(sys.argv[1])))
          except OSError:
              raise SystemExit(0)
          finally:
              sock.close()
          raise SystemExit(1)
          PY
          }
          worker_alive() {
            pgrep -f "$app/Contents/runtime/python/install/bin/python3.13.*scm_workbench.server" >/dev/null 2>&1
          }
          "$app/Contents/MacOS/SCM Workbench" > "$ws/build/macos/smoke.log" 2>&1 &
          app_pid=$!
          ipc_ok=""
          for i in $(seq 1 90); do
            sleep 1
            if ! port_closed 8038; then
              echo "smoke FAILED: packaged worker opened port 8038" >&2
              exit 1
            fi
            if worker_alive && grep -q "\[ipc\] served ready" "$data/server-tauri.log" 2>/dev/null \
               && grep -q "\[ipc\] served info" "$data/server-tauri.log" 2>/dev/null \
               && grep -q "\[ipc\] served manifest" "$data/server-tauri.log" 2>/dev/null \
               && grep -q "\[ipc\] served settings.get" "$data/server-tauri.log" 2>/dev/null \
               && grep -q "\[ipc\] served jobs.list" "$data/server-tauri.log" 2>/dev/null \
               && grep -q "\[ipc\] served updates.get" "$data/server-tauri.log" 2>/dev/null; then
              ipc_ok=1
              break
            fi
          done
          if [ -z "$ipc_ok" ]; then
            echo "---- smoke.log ----"; cat "$ws/build/macos/smoke.log" || true
            echo "---- server log ----"; cat "$data/server-tauri.log" 2>/dev/null || true
            echo "smoke FAILED: the embedded UI did not produce ready plus five public native IPC markers" >&2
            kill -9 "$app_pid" 2>/dev/null || true
            exit 1
          fi
          # Soft close proof: send the native application a quit AppleEvent so
          # Tauri runs its window/EOF cleanup rather than relying on SIGTERM.
          if ! osascript -e "tell application \"$app\" to quit"; then
            echo "smoke FAILED: could not request native app close" >&2
            kill -9 "$app_pid" 2>/dev/null || true
            exit 1
          fi
          for i in $(seq 1 60); do
            if ! kill -0 "$app_pid" 2>/dev/null; then break; fi
            sleep 0.25
          done
          if kill -0 "$app_pid" 2>/dev/null; then
            echo "smoke FAILED: native app close did not exit" >&2
            kill -9 "$app_pid" 2>/dev/null || true
            exit 1
          fi
          wait "$app_pid" 2>/dev/null || true
          sleep 1
          if worker_alive; then
            echo "smoke FAILED: soft close left the supervised worker running" >&2
            pgrep -fl "$app/Contents/runtime/python/install/bin/python3.13.*scm_workbench.server" >&2 || true
            exit 1
          fi
          if ! port_closed 8038; then
            echo "smoke FAILED: port 8038 opened or remained open after soft close" >&2
            exit 1
          fi
          # No worker HTTP request is possible in this mode; any such log line
          # would indicate an escaped WebView transport.
          if grep -E '^\[workbench\] "(GET|POST) /' "$data/server-tauri.log" >/dev/null 2>&1; then
            cat "$data/server-tauri.log" >&2
            echo "smoke FAILED: the embedded WebView made an HTTP request" >&2
            exit 1
          fi
          echo "smoke: embedded UI emitted ready plus five public IPC markers, port stayed closed, and soft close reaped the worker"
      - name: Reap check - a hard-killed app must not orphan its worker
        # Hard termination cannot run CloseRequested.  Process identity and
        # the closed port are the evidence; no broad process reclamation is
        # permitted.
        run: |
          set -uo pipefail
          ws="$GITHUB_WORKSPACE"
          app="$ws/build/macos/SCM Workbench.app"
          export PYTHONDONTWRITEBYTECODE=1
          export SCM_WORKBENCH_NO_UPDATE_CHECK=1
          data="$(mktemp -d /private/tmp/scm-workbench-reap.XXXXXX)/scm-data"
          export SCM_WORKBENCH_DATA="$data"
          export SCM_WORKBENCH_NO_BOOTSTRAP=1
          port_closed() {
            python3 - "$1" <<'PY'
          import socket, sys
          sock = socket.socket()
          sock.settimeout(0.2)
          try:
              sock.connect(("127.0.0.1", int(sys.argv[1])))
          except OSError:
              raise SystemExit(0)
          finally:
              sock.close()
          raise SystemExit(1)
          PY
          }
          worker_alive() {
            pgrep -f "$app/Contents/runtime/python/install/bin/python3.13.*scm_workbench.server" >/dev/null 2>&1
          }
          "$app/Contents/MacOS/SCM Workbench" > "$ws/build/macos/reap.log" 2>&1 &
          app_pid=$!
          worker_ok=""
          for i in $(seq 1 20); do
            sleep 0.5
            if ! port_closed 8038; then
              echo "reap FAILED: packaged worker opened port 8038" >&2
              kill -9 "$app_pid" 2>/dev/null || true
              exit 1
            fi
            if worker_alive && grep -q "\[ipc\] served ready" "$data/server-tauri.log" 2>/dev/null; then worker_ok=1; break; fi
          done
          if [ -z "$worker_ok" ]; then
            echo "---- reap.log ----"; cat "$ws/build/macos/reap.log" 2>/dev/null || true
            echo "reap FAILED: the worker never completed the native handshake" >&2
            kill -9 "$app_pid" 2>/dev/null || true
            exit 1
          fi
          kill -9 "$app_pid" 2>/dev/null || true
          sleep 1
          if worker_alive; then
            echo "reap FAILED: a worker outlived the hard-killed app" >&2
            pgrep -fl "$app/Contents/runtime/python/install/bin/python3.13.*scm_workbench.server" >&2 || true
            exit 1
          fi
          if ! port_closed 8038; then
            echo "reap FAILED: port 8038 remained open after hard termination" >&2
            exit 1
          fi
          echo "reap: hard-killed the app, native worker reaped, and port stayed closed"
      - name: Re-seal the bundle after the smoke test
        # The smoke run is the last thing that executes from the bundle, and
        # a straggler it wakes can keep writing after the Sign step's seal.
        # (The v0.3.0 package is the standing example: nine pbs runtime files
        # were re-written from the pbs archive *after* the seal, so the copied
        # bundle read "damaged" on every machine.) Re-sign now so whatever has
        # landed is covered by the fresh seal before the DMG is assembled.
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build/macos"
          sleep 5  # let in-flight writers land before the seal, not after
          codesign --force --deep --sign - "SCM Workbench.app"
      - name: Build the drag-to-Applications installer
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/scripts/build_macos_dmg.sh" \
            "$GITHUB_WORKSPACE/build/macos/SCM Workbench.app" \
            "$GITHUB_WORKSPACE/tauri/dmg-background.png" \
            "$GITHUB_WORKSPACE/build/macos/scm-workbench-macos.dmg"
      - name: Verify the installer
        # Verify the bytes users and the updater actually receive, rather than
        # trusting only the pre-container bundle tree.
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/build/macos"
          mount="$(mktemp -d /private/tmp/scm-workbench-dmg.XXXXXX)"
          cleanup() {
            hdiutil detach "$mount" -quiet >/dev/null 2>&1 || true
            rmdir "$mount" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach -quiet -readonly -nobrowse -mountpoint "$mount" scm-workbench-macos.dmg
          test -d "$mount/SCM Workbench.app"
          test -L "$mount/Applications"
          test "$(readlink "$mount/Applications")" = "/Applications"
          test -f "$mount/.DS_Store"
          test -f "$mount/.background/background.png"
          test ! -e "$mount/.metadata_never_index"
          codesign --verify --verbose=2 "$mount/SCM Workbench.app"
          case "$(file -b "$mount/SCM Workbench.app/Contents/MacOS/SCM Workbench")" in
            *arm64*) ;;
            *) echo "DMG does not contain an arm64 shell" >&2; exit 1 ;;
          esac
          hdiutil detach "$mount" -quiet
          rmdir "$mount"
          trap - EXIT
          echo "the DMG carries the sealed arm64 app"
      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: scm-workbench-macos-${{ steps.build_meta.outputs.short_sha }}
          path: build/macos/scm-workbench-macos.dmg
          # GitHub wraps Actions artifacts in a transport ZIP. The file inside
          # is the standard DMG users open; release downloads are the raw DMG.
          retention-days: 1
  windows:
    runs-on: windows-latest  # x64 release target
    env:
      # Keep Cargo's generated target tree outside the checkout; frontendDist
      # embeds only the bounded ui/ tree.
      CARGO_TARGET_DIR: ${{ github.workspace }}\..\scm-workbench-tauri-target
      # Make source/check-script decoding independent of the runner's legacy
      # Windows ANSI code page. The packaged worker also runs in UTF-8 mode.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Record build revision
        id: build_meta
        shell: pwsh
        run: |
          "short_sha=$(git rev-parse --short=7 HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Assert the release architecture
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") { throw "Windows package requires AMD64, got $env:PROCESSOR_ARCHITECTURE" }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python and UI transport checks
        run: |
          python -m unittest discover -s tests -v
          python -m unittest tests.test_update_handoff -v
          python scripts/check_ui_imports.py
          python scripts/check_ui_transport.py
          python scripts/check_ui_decklists.py
          python scripts/check_ui_back_images.py
          python scripts/check_ui_fetch_recents.py
          python scripts/check_ui_jobs.py
          python scripts/check_ui_repos.py
          python scripts/check_ui_onboarding.py
          python scripts/check_ui_tutorial.py
          python scripts/check_ui_preview.py
          python scripts/check_ui_pdf_preview.py
          python scripts/check_ui_artifacts.py
          python scripts/check_ui_history.py
          python scripts/check_ui_native_actions.py
          python scripts/check_ui_save.py
          python scripts/check_ui_settings.py
          python scripts/check_ui_offsets.py
          python scripts/check_ui_updates.py
          python scripts/check_ui_update_security.py
          python scripts/check_ui_fs_delete.py
          python scripts/check_tauri_embedded.py
      - name: Node syntax check — every UI module
        shell: pwsh
        run: Get-ChildItem ui/js -Filter *.js -Recurse | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
      - name: Pin the version from the release tag
        # On a tag push GITHUB_REF_NAME is the tag (v0.3.0) - it becomes the
        # Python side's __version__, the Tauri conf/Cargo version and the
        # exe's stamped metadata at once. Dispatch/test runs keep the
        # [project] version declared in the repo.
        run: python scripts/inject_version.py
      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        working-directory: tauri
        run: cargo test
      - name: Helper CLI invalid-mode smoke
        working-directory: tauri
        shell: pwsh
        run: |
          cargo run --quiet -- --update-helper --data-dir C:\definitely\not-canonical\..\data --token aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --mode invalid
          if ($LASTEXITCODE -eq 0) { throw "invalid helper mode was accepted" }
          # The nonzero status above is the expected assertion result. Clear it
          # so the pwsh action wrapper does not convert success into a failure.
          $global:LASTEXITCODE = 0
      - name: Build the Tauri shell
        # --features custom-protocol is what `cargo tauri build` passes: it
        # makes Tauri serve the window's initial page from its embedded asset
        # protocol instead of the dev URL, so the splash shows instantly
        # without the worker's port existing yet (no "can't reach" flash).
        working-directory: tauri
        run: cargo build --release --features custom-protocol
      - name: Fetch the pinned runtime and bake the job dependencies into it
        # The exact python-build-standalone archive the launcher would fetch
        # on a user's first boot (name imported, not re-spelled), unpacked
        # into the bundle, with the managed repos' requirements pip-installed
        # in. The shipped bundle is self-contained: first launch downloads
        # nothing but the managed repo copies themselves.
        run: python scripts/bake_runtime.py --bundle build\windows
      - name: Assemble the bundle
        # The flat layout a first-boot user sees: the exe at the root, the
        # app code in app/ (where the worker's PYTHONPATH points), the
        # runtime beside them. The per-user data area is created by the
        # app at launch - it is never part of the bundle.
        run: |
          $ws = (Resolve-Path .).Path
          $bundle = Join-Path $ws "build\windows"
          Copy-Item (Join-Path $env:CARGO_TARGET_DIR "release\scm-workbench.exe") (Join-Path $bundle "SCM Workbench.exe")
          New-Item -ItemType Directory -Force (Join-Path $bundle "app") | Out-Null
          Copy-Item (Join-Path $ws "scm_workbench") (Join-Path $bundle "app\scm_workbench") -Recurse
          Copy-Item (Join-Path $ws "ui") (Join-Path $bundle "app\ui") -Recurse
          New-Item -ItemType Directory -Force (Join-Path $bundle "app\docs") | Out-Null
          Copy-Item (Join-Path $ws "docs\image-postprocessing.md") (Join-Path $bundle "app\docs\image-postprocessing.md")
          # The bake's scratch dir (the requirements clones live there briefly)
          # must not ship inside the bundle:
          Remove-Item -Recurse -Force (Join-Path $bundle ".bake") -ErrorAction SilentlyContinue
          Get-ChildItem $bundle | Select-Object Name, Length
          $runtimePython = Join-Path $bundle "runtime\python\install\python.exe"
          Push-Location (Join-Path $bundle "app")
          try {
            & $runtimePython -B -c "from scm_workbench import server; result = server.postprocessor_guide(); assert result.get('ok') and '<h1>Image post-processing</h1>' in result.get('body', ''); print('smoke: bundled post-processing guide renders')"
            if ($LASTEXITCODE) { throw "packaged post-processing guide smoke failed" }
          } finally { Pop-Location }
          & $runtimePython (Join-Path $ws "scripts\check_pdf_preview_helper.py") (Join-Path $bundle "app\scm_workbench\pdf_preview_helper.py")
          if ($LASTEXITCODE) { throw "packaged PDF preview helper smoke failed" }
      - name: Smoke test - embedded UI and native IPC
        # Private ready plus five public UI IPC markers prove rendering.
        # A packaged worker has no HTTP listener, so port 8038 is checked while
        # the app runs and after the normal close path.
        run: |
          $ws = (Resolve-Path .).Path
          $requestedData = Join-Path $env:RUNNER_TEMP "wb-smoke-data"
          New-Item -ItemType Directory -Force $requestedData | Out-Null
          $env:SCM_WORKBENCH_DATA = (Resolve-Path $requestedData).Path
          $env:SCM_WORKBENCH_NO_BOOTSTRAP = "1"
          $env:SCM_WORKBENCH_NO_UPDATE_CHECK = "1"
          $log = Join-Path $env:SCM_WORKBENCH_DATA "server-tauri.log"
          $stdout = Join-Path $env:RUNNER_TEMP "wb-shell-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "wb-shell-stderr.log"
          $proc = Start-Process -FilePath (Join-Path $ws "build\windows\SCM Workbench.exe") `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          function Test-WorkbenchPort {
            $client = [System.Net.Sockets.TcpClient]::new()
            try {
              $attempt = $client.ConnectAsync("127.0.0.1", 8038)
              return $attempt.Wait(250) -and $client.Connected
            } catch {
              return $false
            } finally {
              $client.Dispose()
            }
          }
          $workerOk = $false
          $ipcOk = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 1
            if (Test-WorkbenchPort) { throw "smoke: packaged worker opened port 8038" }
            if (Test-Path $log) {
              $workerOk = [bool](-not $proc.HasExited -and (Select-String -Path $log -Pattern '\[ipc\] served ready' -Quiet))
              # These markers are emitted only after the embedded index's
              # JavaScript invokes the native bridge.
              $ipcOk = [bool]((Select-String -Path $log -Pattern '\[ipc\] served info' -Quiet) -and
                (Select-String -Path $log -Pattern '\[ipc\] served manifest' -Quiet) -and
                (Select-String -Path $log -Pattern '\[ipc\] served settings\.get' -Quiet) -and
                (Select-String -Path $log -Pattern '\[ipc\] served jobs\.list' -Quiet) -and
                (Select-String -Path $log -Pattern '\[ipc\] served updates\.get' -Quiet))
            }
            if ($workerOk -and $ipcOk) { break }
          }
          if (-not $workerOk -or -not $ipcOk) {
            Write-Host "shell exited: $($proc.HasExited)"
            if ($proc.HasExited) { Write-Host "shell exit code: $($proc.ExitCode)" }
            foreach ($diagnostic in @($log, $stdout, $stderr)) {
              Write-Host "---- $diagnostic ----"
              if (Test-Path $diagnostic) { Get-Content $diagnostic }
            }
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            if (-not $workerOk) { throw "smoke: the worker never completed the native handshake" }
            throw "smoke: the embedded UI did not produce ready plus five public native IPC markers"
          }
          if (Test-Path $log) {
            $httpRequests = Get-Content $log | Where-Object { $_ -match '^\[workbench\] "(GET|POST) /' }
            if ($httpRequests) { Get-Content $log; throw "smoke: the embedded WebView made an HTTP request" }
          }
          # Soft close proof: close the native window and verify the job object
          # reaps the worker without force-killing it.
          if (-not $proc.CloseMainWindow()) { throw "smoke: could not request a soft close" }
          if (-not $proc.WaitForExit(15000)) { throw "smoke: soft close did not exit" }
          Start-Sleep -Seconds 2
          $remaining = Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" |
            Where-Object { $_.ExecutablePath -like "$ws\build\windows\runtime\*" }
          if ($remaining) { $remaining | Format-List ProcessId,ExecutablePath; throw "smoke: the supervised worker outlived soft close" }
          if (Test-WorkbenchPort) { throw "smoke: port 8038 remains open after soft close" }
          Write-Host "smoke: embedded UI emitted ready plus five public IPC markers, port stayed closed, and soft close reaped the worker"
      - name: Reap check - a hard-killed app must not orphan its worker
        # Hard termination bypasses CloseRequested. Process identity and the
        # closed port are the evidence; no broad process kill is used.
        run: |
          $ws = (Resolve-Path .).Path
          $requestedData = Join-Path $env:RUNNER_TEMP "wb-reap-data"
          New-Item -ItemType Directory -Force $requestedData | Out-Null
          $env:SCM_WORKBENCH_DATA = (Resolve-Path $requestedData).Path
          $env:SCM_WORKBENCH_NO_BOOTSTRAP = "1"
          $env:SCM_WORKBENCH_NO_UPDATE_CHECK = "1"
          $log = Join-Path $env:SCM_WORKBENCH_DATA "server-tauri.log"
          $proc = Start-Process -FilePath (Join-Path $ws "build\windows\SCM Workbench.exe") -PassThru
          function Test-WorkbenchPort {
            $client = [System.Net.Sockets.TcpClient]::new()
            try {
              $attempt = $client.ConnectAsync("127.0.0.1", 8038)
              return $attempt.Wait(250) -and $client.Connected
            } catch {
              return $false
            } finally {
              $client.Dispose()
            }
          }
          $ready = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Milliseconds 500
            if (Test-WorkbenchPort) { $proc.Kill(); throw "reap FAILED: packaged worker opened port 8038" }
            if (Test-Path $log) {
              $ready = [bool](-not $proc.HasExited -and (Select-String -Path $log -Pattern '\[ipc\] served ready' -Quiet))
            }
            if ($ready) { break }
          }
          if (-not $ready) {
            $proc.Kill()
            throw "reap FAILED: worker never completed the native handshake"
          }
          $proc.Kill()
          $proc.WaitForExit()
          Start-Sleep -Seconds 2
          $remaining = Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" |
            Where-Object { $_.ExecutablePath -like "$ws\build\windows\runtime\*" }
          if ($remaining) { $remaining | Format-List ProcessId,ExecutablePath; throw "reap FAILED: worker outlived hard termination" }
          if (Test-WorkbenchPort) { throw "reap FAILED: port 8038 remained open after hard termination" }
          Write-Host "reap: hard-killed the app, native worker reaped, and port stayed closed"
      - name: Zip
        run: |
          $app = Join-Path (Resolve-Path .).Path "build\windows"
          Compress-Archive -Path (Join-Path $app "*") -DestinationPath "$app\scm-workbench-windows.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scm-workbench-windows-${{ steps.build_meta.outputs.short_sha }}
          path: build/windows/scm-workbench-windows.zip
          retention-days: 1  # see the macos step above

  linux:
    # Build once on the oldest supported GNU/Linux baseline, then package the
    # same x86_64 shell/runtime for Debian-family and Arch-family desktops.
    runs-on: ubuntu-22.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../scm-workbench-tauri-linux-target
      PIP_FIND_LINKS: file://${{ github.workspace }}/ciwheels
      # Pin the official x86_64 Arch build environment. pacman -Syu in the
      # install smoke refreshes its rolling userspace before package testing.
      ARCH_CONTAINER: archlinux:base-devel@sha256:4894f5a268c696fad671966f383175a13faf433c9d9c88cdd4e32eaa2d18838b
      MANJARO_CONTAINER: manjarolinux/base@sha256:bbf1f1d746f28e138eea610e140d2f28cbb5b7c5da2fbff034b883527aa604e9
    steps:
      - uses: actions/checkout@v4
      - name: Record build revision
        id: build_meta
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Assert the release architecture
        run: test "$(uname -m)" = "x86_64"
      - name: Install Linux build and smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang zstd pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf \
            xdg-utils xvfb xauth xdotool dbus-x11
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python and UI transport checks
        run: |
          python -m unittest discover -s tests -v
          python -m unittest tests.test_update_handoff -v
          python scripts/check_ui_imports.py
          python scripts/check_ui_transport.py
          python scripts/check_ui_decklists.py
          python scripts/check_ui_back_images.py
          python scripts/check_ui_fetch_recents.py
          python scripts/check_ui_jobs.py
          python scripts/check_ui_repos.py
          python scripts/check_ui_onboarding.py
          python scripts/check_ui_tutorial.py
          python scripts/check_ui_preview.py
          python scripts/check_ui_pdf_preview.py
          python scripts/check_ui_artifacts.py
          python scripts/check_ui_history.py
          python scripts/check_ui_native_actions.py
          python scripts/check_ui_save.py
          python scripts/check_ui_settings.py
          python scripts/check_ui_offsets.py
          python scripts/check_ui_updates.py
          python scripts/check_ui_update_security.py
          python scripts/check_ui_fs_delete.py
          python scripts/check_tauri_embedded.py
      - name: Node syntax check — every UI module
        run: find ui/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Pin the version from the release tag
        run: python scripts/inject_version.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        working-directory: tauri
        run: cargo test
      - name: Helper CLI invalid-mode smoke
        working-directory: tauri
        run: |
          if cargo run --quiet -- --update-helper --data-dir /definitely/not-canonical/../data --token aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --mode invalid; then
            echo "invalid helper mode was accepted" >&2
            exit 1
          fi
      - name: Build the Tauri shell
        working-directory: tauri
        run: cargo build --release --features custom-protocol
      - name: Bake the bundled Linux runtime
        run: python scripts/bake_runtime.py --bundle build/linux
      - name: Assemble the Debian package
        run: |
          python scripts/build_linux_deb.py \
            --binary "$CARGO_TARGET_DIR/release/scm-workbench" \
            --bundle build/linux
          dpkg-deb --info build/linux/scm-workbench-linux-amd64.deb
      - name: Install and verify the Debian package
        run: |
          sudo apt-get install -y ./build/linux/scm-workbench-linux-amd64.deb
          sudo dpkg -V scm-workbench
          test "$(readlink /usr/bin/scm-workbench)" = "../lib/scm-workbench/scm-workbench"
          if ldd /usr/lib/scm-workbench/scm-workbench | grep -q "not found"; then
            ldd /usr/lib/scm-workbench/scm-workbench
            exit 1
          fi
      - name: Smoke test - embedded UI, native IPC, and worker lifecycle
        run: |
          runtime_dir="${RUNNER_TEMP}/scm-workbench-xdg"
          mkdir -m 700 "$runtime_dir"
          export XDG_RUNTIME_DIR="$runtime_dir"
          xvfb-run -a dbus-run-session -- \
            scripts/check_linux_package.sh /usr/lib/scm-workbench/scm-workbench
      - name: Assemble the Arch package in a pinned clean container
        run: |
          docker run --rm \
            --env HOST_UID="$(id -u)" --env HOST_GID="$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$CARGO_TARGET_DIR:/cargo-target:ro" \
            --workdir /workspace \
            "$ARCH_CONTAINER" bash -euo pipefail -c '
              groupadd --non-unique --gid "$HOST_GID" builder
              useradd --non-unique --uid "$HOST_UID" --gid "$HOST_GID" --create-home builder
              runuser -u builder -- python scripts/build_linux_arch.py \
                --binary /cargo-target/release/scm-workbench \
                --bundle /workspace/build/linux
              beta=$(runuser -u builder -- python -c \
                "from scripts.build_linux_arch import arch_version; print(arch_version(\"0.9.0-beta.2\"))")
              beta10=$(runuser -u builder -- python -c \
                "from scripts.build_linux_arch import arch_version; print(arch_version(\"0.9.0-beta.10\"))")
              test "$(vercmp "$beta" 0.9.0)" = -1
              test "$(vercmp "$beta" "$beta10")" = -1
            '
      - name: Install and smoke-test the Arch package in a clean Arch container
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            "$ARCH_CONTAINER" \
            /workspace/scripts/check_arch_package.sh \
            /workspace/build/linux/scm-workbench-linux-arch-x86_64.pkg.tar.zst
      - name: Install and smoke-test the Arch package in a clean Manjaro container
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            "$MANJARO_CONTAINER" \
            /workspace/scripts/check_arch_package.sh \
            /workspace/build/linux/scm-workbench-linux-arch-x86_64.pkg.tar.zst
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: scm-workbench-linux-${{ steps.build_meta.outputs.short_sha }}
          path: |
            build/linux/scm-workbench-linux-amd64.deb
            build/linux/scm-workbench-linux-arch-x86_64.pkg.tar.zst
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Attach the built artifacts to the release
        timeout-minutes: 5
        # The release itself (title + notes) is created *outside* this
        # workflow - `gh release create vX.Y.Z --notes-file ...` right before
        # the tag push, or from the GitHub UI. This job adds the macOS DMG,
        # portable Windows ZIP, Debian/Ubuntu package, and Arch/Manjaro
        # package. If
        # no release exists for the tag, create one with prerelease status
        # derived from the SemVer suffix. An existing release must agree so a
        # beta tag can never leak into the stable updater channel.
        # (--repo on every call: this job has no checkout for gh to infer
        #  the owner/repo from.)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          expected_prerelease=false
          prerelease_args=()
          version_without_build=${GITHUB_REF_NAME%%+*}
          if [[ "$version_without_build" == *-* ]]; then
            expected_prerelease=true
            prerelease_args+=(--prerelease)
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            actual_prerelease=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)
            if [[ "$actual_prerelease" != "$expected_prerelease" ]]; then
              echo "Release prerelease status does not match tag $GITHUB_REF_NAME" >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --verify-tag "${prerelease_args[@]}"
          fi
          upload_release_assets() {
            local attempt status delay
            local upload_log="$RUNNER_TEMP/release-upload.log"
            for attempt in 1 2 3; do
              echo "Uploading release assets (attempt $attempt of 3)"
              set +e
              timeout --signal=TERM --kill-after=5s 75s \
                gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" scm-workbench-macos.dmg scm-workbench-windows.zip scm-workbench-linux-amd64.deb scm-workbench-linux-arch-x86_64.pkg.tar.zst --clobber \
                2>&1 | tee "$upload_log"
              status=${PIPESTATUS[0]}
              set -e
              if (( status == 0 )); then
                return 0
              fi

              # uploads.github.com has previously returned HTTP 500 and left
              # gh waiting indefinitely. Retry only timeouts, server failures,
              # and short-lived transport errors; fail permission and input
              # errors immediately instead of hiding them behind retries.
              if (( status == 124 || status == 137 )) || \
                  grep -Eiq 'HTTP[^0-9]*5[0-9]{2}|Internal Server Error|Error saving asset|Error creating asset temp dir|connection reset|timed? out|unexpected EOF' "$upload_log"; then
                if (( attempt == 3 )); then
                  echo "::error title=Release upload failed::Release asset upload still failed after 3 bounded attempts. Actions artifacts were retained for manual recovery."
                  return 1
                fi
                delay=$((attempt * 10))
                echo "::warning title=Release upload retry::Attempt $attempt failed with a transient server or transport error; retrying in ${delay}s."
                sleep "$delay"
                continue
              fi

              echo "::error title=Release upload failed::Release asset upload failed with a non-retryable error (exit $status)."
              return "$status"
            done
          }
          upload_release_assets
      - name: Delete Actions artifacts after release attachment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].id' |
            while read -r artifact_id; do
              [ -z "$artifact_id" ] || gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
            done
