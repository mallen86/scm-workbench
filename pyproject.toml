# ============================================================================
# SCM Workbench — project & packaging metadata.
#
# The Workbench itself is stdlib-only; the app bundle exists mainly to carry
# (a) a full CPython + the sister repos' pinned dependencies, and (b) the
# first-launch bootstrap in launcher.py.
#
# Building a distributable app:
#     briefcase build macos app      # or: briefcase build windows app
#   (on a GitHub Actions runner these run unattended; see .github/workflows)
# ============================================================================

[project]
name = "scm-workbench"
version = "0.3.5"
description = "A local web UI for silhouette-card-maker and scm-extras — no terminal, no setup."
authors = [{ name = "the SCM Workbench maintainers" }]
license = "MIT"
license-files = ["LICENSE.md"]
# Pin the dev venv to the interpreter the bundle actually ships (the
# `python_version` in the briefcase config below, 3.13 — same as CI).
# Unpinned, a fresh `uv sync` lands on the newest installed Python, and a
# from-scratch `briefcase build` then resolves the bundled app_packages
# wheels for that wrong version (or dies on the sdist-only proxy_tools —
# see the PIP_FIND_LINKS note in CONTRIBUTING.md).
requires-python = ">=3.13,<3.14"

[tool.briefcase]
bundle = "local.scm-workbench"
project_name = "scm-workbench"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# The repo root also holds UI assets and local dev folders; name the
# package explicitly so generic tools (pip/uv/setuptools) never guess.
[tool.setuptools]
packages = ["scm_workbench"]

[tool.briefcase.app.scm-workbench]
python_version = "3.13"
formal_name = "SCM Workbench"
description = "Print, cut and play: a local console for the Silhouette Card Maker repos."
document_home_page = "https://github.com/Alan-Cha/silhouette-card-maker"
entry_point = "scm_workbench"
sources = ["scm_workbench", "ui"]
# The app's own code needs nothing beyond the standard library. The support
# venv, however, is where the *managed repo copies* run, so it carries the
# pinned dependencies from silhouette-card-maker's requirements.txt
# (see the per-platform sections below).
requires = [
    "certifi>=2024.2.2",
    "click==8.4.2",
    "cloudscraper==1.2.71",
    "filetype==1.2.0",
    "mtg_parser==0.0.1a55",
    "natsort==8.4.0",
    "pydantic==2.13.4",
    "requests==2.34.2",
    "split-image==2.0.5",
]

[tool.briefcase.app.scm-workbench.macOS]
# The app icon: briefcase's create step installs this over the template's
# placeholder icon (Resources/<app-name>.icns — the exact file the template's
# Info.plist points CFBundleIconFile at), so a *completed* build shows the
# real mark in Dock/Finder/About with no plist surgery. Note the config
# takes the path *without* the extension - briefcase appends the target's
# own suffix (.icns on macOS, .ico on Windows). If a fresh bundle still
# shows the template's generic icon, create didn't finish - check the build
# log for the pip failure (CONTRIBUTING.md, "Packaging the app").
icon = "assets/AppIcon"
info_plist = { NSHumanReadableCopyright = "Thanks to Alan Cha for silhouette-card-maker and scm-extras." }
requires = [
    "click==8.4.2",
    "cloudscraper==1.2.71",
    "filetype==1.2.0",
    "matplotlib==3.11.1",
    "mtg_parser==0.0.1a55",
    "natsort==8.4.0",
    "numpy==2.5.2",
    "pillow==12.3.0",
    "pydantic==2.13.4",
    "pypdfium2==5.9.0",
    "requests==2.34.2",
    "split-image==2.0.5",
    "ezdxf==1.4.4",
    # The app window: a native WKWebView (system framework, pip driver)
    "pywebview==6.2.1",
]
# (pyautogui/pywinauto are Windows-only GUI automation — not needed on macOS)

# The header's case matters: briefcase matches these section names against its
# platform registry *case-sensitively* ("macOS" above is the registry's exact
# key; this one is lowercase "windows"). A misspelled header is skipped
# silently - the build succeeds with only the base requires (which is how a
# "Windows" here once shipped an app without pywebview or the PDF stack).
[tool.briefcase.app.scm-workbench.windows]
# no extension here either - briefcase appends the target's own suffix
icon = "assets/AppIcon"
requires = [
    "click==8.4.2",
    "cloudscraper==1.2.71",
    "ezdxf==1.4.4",
    "filetype==1.2.0",
    "matplotlib==3.11.1",
    "mtg_parser==0.0.1a55",
    "natsort==8.4.0",
    "numpy==2.5.2",
    "pillow==12.3.0",
    "pyautogui==0.9.54",
    "pydantic==2.13.4",
    "pypdfium2==5.9.0",
    "pywinauto==0.6.9",
    "requests==2.34.2",
    "split-image==2.0.5",
    # The app window: WebView2 (already on Windows 10/11); pywebview drives it
    "pywebview==6.2.1",
]
